<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./image-slot.js"></script></helmet>
<div style="position:sticky;top:0;z-index:50;padding:28px 16px 0">
  <nav aria-label="Main" style="max-width:1160px;margin:0 auto;background:#FBF6EF;border:2px solid #2B2440;box-shadow:4px 4px 0 #2B2440;border-radius:28px;padding:8px 10px 8px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
    <a href="Home.dc.html" aria-label="The Other Guys, home" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:#2B2440;margin-right:6px">
      <span style="width:36px;height:36px;flex:none;display:block"><image-slot id="tog-logo" shape="rounded" radius="10" src="https://cdn.prod.website-files.com/67041549a38a6939e8db05d2/67041549a38a6939e8db063d_webclip.png" style="width:36px;height:36px"></image-slot></span>
      <span style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;letter-spacing:-0.02em">The Other Guys</span>
    </a>
    <div style="display:flex;gap:4px;flex-wrap:wrap;margin-left:auto;align-items:center">
      <sc-for list="{{ links }}" as="l" hint-placeholder-count="4">
        <a href="{{ l.href }}" aria-current="{{ l.current }}" style="text-decoration:none;font-size:15px;font-weight:600;padding:9px 16px;border-radius:999px;background:{{ l.bg }};color:{{ l.fg }}" style-hover="background:#E6DEFB;color:#2B2440">{{ l.label }}</a>
      </sc-for>
    </div>
    <a href="https://calendly.com/theotherguyss/let-s-talk-about-your-content-marketing" style="text-decoration:none;font-size:15px;font-weight:700;padding:9px 18px;border-radius:999px;background:#F1705B;color:#2B2440;border:2px solid #2B2440;box-shadow:3px 3px 0 #2B2440" style-hover="background:#E85F48">Book a call &rarr;</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1240px&quot;,&quot;height&quot;:&quot;84px&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;none&quot;,&quot;options&quot;:[&quot;none&quot;,&quot;work&quot;,&quot;blog&quot;,&quot;about&quot;,&quot;compare&quot;,&quot;contact&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'none';
    const links = [
      { key: 'work', label: 'Work', href: 'Case-Studies.dc.html' },
      { key: 'blog', label: 'Blog', href: 'Blog.dc.html' },
      { key: 'about', label: 'About', href: 'About.dc.html' },
      { key: 'compare', label: 'Compare', href: 'Compare.dc.html' },
      { key: 'contact', label: 'Contact', href: 'Contact.dc.html' }
    ].map((l) => ({
      ...l,
      current: l.key === active ? 'page' : undefined,
      bg: l.key === active ? '#6B46E5' : 'transparent',
      fg: l.key === active ? '#FBF6EF' : '#2B2440'
    }));
    return { links };
  }
}
</script>
</body>
</html>
